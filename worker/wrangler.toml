name = "gvcs-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# D1 데이터베이스 바인딩
# 아래 database_id 는 `npx wrangler d1 create gvcs-db` 실행 후 출력되는 값으로 바꿔주세요.
[[d1_databases]]
binding = "DB"
database_name = "gvcs-db"
database_id = "여기에-d1-database-id-붙여넣기"

[vars]
# Firebase 프로젝트 ID — 로그인 토큰 검증에 사용합니다.
FIREBASE_PROJECT_ID = "dormhome-1c840"
# 쓰기 권한을 가진 이메일 도메인
ALLOWED_DOMAIN = "gvcs-mg.org"
# API 를 호출할 수 있는 사이트 주소 (쉼표로 구분). 배포 후 실제 주소로 바꿔주세요.
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://dormhome-1c840.web.app,https://dormhome-1c840.firebaseapp.com"
