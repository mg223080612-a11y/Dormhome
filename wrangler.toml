# Cloudflare Pages 설정
# 사이트(dist)와 functions/ 의 API 가 같은 프로젝트로 배포됩니다.
name = "dormhome"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# D1 데이터베이스
[[d1_databases]]
binding = "gvcs_db"
database_name = "gvcs-db"
database_id = "cc7d8a2c-67e1-4ce5-80b4-20053830bc3f"

[vars]
# 로그인 토큰 검증에 쓰는 Firebase 프로젝트 ID
FIREBASE_PROJECT_ID = "dormhome-1c840"
# 쓰기 권한을 가진 이메일 도메인
ALLOWED_DOMAIN = "gvcs-mg.org"

# ADMIN_EMAILS (쓰기 권한을 가진 관리자 이메일, 쉼표 구분) 는 여기에 두지 않습니다.
# 이 저장소는 공개라서 이메일이 그대로 노출되기 때문입니다.
# Cloudflare 시크릿으로 설정하세요:
#   npx wrangler pages secret put ADMIN_EMAILS --project-name dormhome
# 설정 전에는 @gvcs-mg.org 계정이면 누구나 수정할 수 있습니다.
